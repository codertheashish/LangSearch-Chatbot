<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangSearch Chatbot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#667085; --line:#e2e6ec;
  --user:#1f4e79; --user-ink:#ffffff; --bot:#eef1f5; --accent:#1f4e79; --err:#b42318;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161c; --panel:#1a2029; --ink:#e7ebf1; --muted:#98a2b3; --line:#2a323e;
         --user:#3b82c4; --user-ink:#0c1117; --bot:#222a35; --accent:#6aa8e0; --err:#f97066; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:1.1rem;margin:0;font-weight:650}
button{font:inherit;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.assistant{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--user);color:var(--user-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.error{background:none;color:var(--err);border:1px solid var(--err);align-self:flex-start}
.msg.pending{color:var(--muted)}
form.send{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--user-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🔍 LangSearch Chatbot</h1>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <form class="send" id="send">
    <input type="text" id="input" placeholder="Ask anything…" autocomplete="off" aria-label="Message">
    <button class="primary" id="go" type="submit">Send</button>
  </form>
</div>


<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const go = document.getElementById("go");

const FALLBACK = "The AI service is temporarily unavailable. Please try again in a moment.";
let history = [];

function add(role, text, cls=""){
  const d = document.createElement("div");
  d.className = "msg " + role + (cls ? " " + cls : "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

add("assistant", "Hi, I can search Wikipedia and ArXiv. What would you like to know?");

document.getElementById("send").addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("user", text);
  history.push({role:"user", content:text});
  go.disabled = true;
  const pending = add("assistant", "Searching and thinking…", "pending");

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 65000);
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: history}),
      signal: ctrl.signal
    });
    // Read as text first: error pages from the platform are not JSON.
    const raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch (_) {}

    if (!res.ok || !data || typeof data.reply !== "string") {
      console.error("Chat request failed:", res.status, raw.slice(0, 300));
      throw new Error(data && typeof data.error === "string" && data.error ? data.error : FALLBACK);
    }
    pending.remove();
    add("assistant", data.reply);
    history.push({role:"assistant", content:data.reply});
  } catch (err) {
    console.error(err);
    pending.remove();
    history.pop();
    let msg = err.message || FALLBACK;
    if (err.name === "AbortError") msg = "The request took too long. Please try again.";
    else if (err instanceof TypeError) msg = "Could not reach the server. Check your connection and try again.";
    add("assistant", msg, "error");
  } finally {
    clearTimeout(timer);
    go.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
